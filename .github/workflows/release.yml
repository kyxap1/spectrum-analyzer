name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Bundle app
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/bundle.sh "$version"

      - name: Publish release and bump cask
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="SpectrumAnalyzer-$version.zip"
          ditto -c -k --sequesterRsrc --keepParent "Spectrum Analyzer.app" "$zip"

          gh release create "$GITHUB_REF_NAME" "$zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Spectrum Analyzer $version"

          sha256="$(shasum -a 256 "$zip" | cut -d ' ' -f1)"
          git fetch origin master
          git checkout -B master origin/master
          scripts/bump-cask.sh "$version" "$sha256"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/spectrum-analyzer.rb
          git commit -m "Bump cask to $GITHUB_REF_NAME"
          git push origin master
